<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="pos_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>pos_app</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Register Firebase Messaging Service Worker for Web Push -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('firebase-messaging-sw.js', {
          scope: '/firebase-cloud-messaging-push-scope',
        }).then(function (reg) {
          console.log('[FCM SW] Registered successfully with scope:', reg.scope);
        }).catch(function (err) {
          console.error('[FCM SW] Registration failed:', err);
        });
      });
    }

    // Helper for showing notifications when browser tab is currently open (foreground)
    window.showWebNotification = function (title, body) {
      console.log('[FCM Web] showWebNotification called:', title, body);
      if (!('Notification' in window)) {
        console.warn('[FCM Web] Notifications not supported in this browser.');
        return;
      }
      if (Notification.permission !== 'granted') {
        console.warn('[FCM Web] Notification permission is: ' + Notification.permission + ' (cannot show notification).');
        return;
      }

      const options = {
        body: body || '',
        icon: '/icons/Icon-192.png',
        badge: '/icons/Icon-192.png',
        tag: 'pos-notification-' + Date.now(),
        renotify: true,
        requireInteraction: true
      };

      if (navigator.serviceWorker) {
        navigator.serviceWorker.getRegistration('/firebase-cloud-messaging-push-scope').then(function (reg) {
          if (reg && reg.showNotification) {
            console.log('[FCM Web] Showing notification via Service Worker Registration');
            return reg.showNotification(title || 'Notification', options);
          } else {
            console.log('[FCM Web] Showing notification via Notification constructor (no SW reg)');
            return new Notification(title || 'Notification', options);
          }
        }).catch(function (err) {
          console.warn('[FCM Web] SW showNotification error, falling back to Notification constructor:', err);
          try {
            new Notification(title || 'Notification', options);
          } catch (e) {
            console.error('[FCM Web] Direct Notification constructor failed:', e);
          }
        });
      } else {
        try {
          console.log('[FCM Web] Showing notification via direct Notification constructor');
          new Notification(title || 'Notification', options);
        } catch (e) {
          console.error('[FCM Web] Direct Notification constructor failed:', e);
        }
      }
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
